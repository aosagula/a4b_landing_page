services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic4biz-landing:local
    container_name: a4b-webapp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      
    networks:
      - vps_shared_network
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://$(hostname):3001').then((r)=>process.exit(r.ok?0:1)).catch((e)=>{console.error(e.message); process.exit(1)})\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      
networks:
  vps_shared_network:
    external: true
